# GNOME-dark-ish theme + mouse

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# mouse
set -g mouse on
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# silence
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour75   # GNOME-ish blue

# copy mode (selection)
setw -g mode-style 'fg=colour255 bg=colour60 bold'  # light fg on muted blue/purple

# panes (subtle borders; active = blue)
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour75'

# statusbar base (dark grey bg, light grey fg)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour252 bg=colour235'

set -g status-left ''
set -g status-left-length 10

# status right (time chip)
set -g status-right-style 'fg=colour255 bg=colour237'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

# window list (quiet)
setw -g window-status-style 'fg=colour250 bg=colour235'
setw -g window-status-format ' #I #W '

# current window (blue highlight)
setw -g window-status-current-style 'fg=colour255 bg=colour75 bold'
setw -g window-status-current-format ' #I #W '

# bell/message (only “alarm” color)
setw -g window-status-bell-style 'fg=colour255 bg=colour160 bold'
set -g message-style 'fg=colour255 bg=colour160 bold'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# tmux source-file ~/.tmux.conf
